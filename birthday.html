<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, my love 💖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{--bg1:#ffe3ef;--bg2:#e9ddff;--fg:#5a2a55;--card:#ffffffee;--accent:#ff5c9a;--muted:#a0709b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1530;--bg2:#1b1738;--fg:#ffe6f3;--card:#3a2347ee;--accent:#ff7ab0;--muted:#d6a9d0;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1530;--bg2:#1b1738;--fg:#ffe6f3;--card:#3a2347ee;--accent:#ff7ab0;--muted:#d6a9d0;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--fg);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;overflow:hidden;text-align:center}
.bg{position:fixed;bottom:-40px;opacity:.35;font-size:22px;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;font-size:24px;letter-spacing:3px;z-index:4}
#bear{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:0;right:0;text-align:center;z-index:3;line-height:0;animation:bob 2s ease-in-out infinite}
#bear.cheer{animation:cheer .6s}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes cheer{40%{transform:translateY(-34px) rotate(-12deg) scale(1.2)}}
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:2}
.card{background:var(--card);border-radius:32px;padding:30px 26px;max-width:330px;box-shadow:0 10px 40px rgba(255,92,154,.3);border:3px dashed var(--accent)}
h1{margin:0 0 6px;font-size:30px;color:var(--accent)}
p{margin:10px 0 18px;line-height:1.5;font-size:18px}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:13px 30px;font:600 19px "Fredoka",system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.big{font-size:54px;display:block;margin-bottom:6px}
.item{position:absolute;top:-70px;font-size:48px;cursor:pointer;user-select:none;animation:fall linear forwards;z-index:5;filter:drop-shadow(0 4px 6px rgba(255,92,154,.4))}
@keyframes fall{to{transform:translateY(112vh) rotate(20deg)}}
.pop{position:absolute;font-size:28px;pointer-events:none;animation:up .8s forwards;z-index:6}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.conf{position:absolute;top:-30px;font-size:26px;animation:fall linear forwards;pointer-events:none;z-index:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--card);color:var(--fg);padding:14px 22px;border-radius:24px;box-shadow:0 8px 30px rgba(255,92,154,.4);width:max-content;max-width:290px;font-size:19px;z-index:10;animation:pin .35s;border:2px solid var(--accent)}
@keyframes pin{from{opacity:0;transform:translate(-50%,14px) scale(.9)}}
.candles{display:flex;justify-content:center;gap:26px;margin:0 0 4px}
.candle{width:34px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.flame{font-size:30px;height:38px;line-height:38px;transform-origin:50% 90%;animation:flick .5s ease-in-out infinite alternate;transition:all .4s}
@keyframes flick{to{transform:scale(1.12) rotate(5deg)}}
.stick{width:18px;height:56px;margin:0 auto;border-radius:6px 6px 4px 4px;background:#ff7eb6;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.candle:nth-child(2) .stick{background:#b69cff}
.candle:nth-child(3) .stick{background:#ffc857}
.candle.out .flame{animation:none;opacity:0;transform:translateY(-8px) scale(.4)}
.candle.out::after{content:"💨";position:absolute;left:50%;top:0;margin-left:-10px;font-size:20px;animation:up .9s forwards}
.hint{font-size:16px;color:var(--muted);margin:8px 0 14px}
.title{font-size:28px;font-weight:700;color:#dc143c;line-height:1.1;margin-bottom:8px}
.title span{display:block;font-size:56px;font-weight:700;background:linear-gradient(90deg,#ff5c9a,#b57cff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 6px rgba(255,92,154,.35));animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.06)}}
.hint small{font-size:13px;opacity:.8}
#bear img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:4px solid var(--accent);background:#fff;box-shadow:0 6px 16px rgba(255,92,154,.45)}
.ask{font-size:21px;font-weight:600;color:var(--accent);margin:6px 0 12px;line-height:1.3}
.ask small{font-size:13px;font-weight:400;color:var(--muted)}
.hint{margin:6px 0 8px !important}
#bear.dance{animation:dance 1.1s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0) scale(1)}15%{transform:translateY(-30px) rotate(-14deg) scale(1.2)}30%{transform:translateY(0) rotate(0) scale(1)}45%{transform:translateY(-30px) rotate(14deg) scale(1.2)}60%{transform:translateY(0) rotate(0) scale(1)}80%{transform:translateY(-12px) scale(1.12)}}
</style>
</head>

<script>
// ✏️ Personalise here:
var NAME = "Cutie";
var MESSAGES = [
  "You’re my favorite person ever 💕",
  "You make me smile like crazy 😊",
  "I love annoying you so much 😝",
  "You’re my safe place 🏡",
  "You’re so beautiful 😳",
  "You're so precious to me 💖",
  "Here’s to many more adventures together ✨",
  "May this year be the bestest for you ever 🎉",
  "I love you ❤️"
];
var FINAL = "Thank you for being you. YOU ARE THE BESTEST!!!!! Praying you have the best year ahead and all your dreams and wishes come true!! I can’t wait to make more memories with you this year and forever. Lots of love and hugs and kisses to you!!!";
var GOAL = MESSAGES.length;
var items = ["👻","💌","🍫","🐥","🌹","💖","🎁","🎈"];
var screen = document.getElementById("screen"), hud = document.getElementById("hud"), bear = document.getElementById("bear");
var score = 0, timer = null;

// floating hearts in the background
["💗","💕","✨","🌸"].forEach(function(e,i){
  for(var k=0;k<4;k++){
    var b = document.createElement("div");
    b.className = "bg"; b.textContent = e;
    b.style.left = Math.random()*100 + "vw";
    b.style.animationDuration = (12 + Math.random()*10) + "s";
    b.style.animationDelay = -Math.random()*15 + "s";
    document.body.appendChild(b);
  }
});

function hearts(){
  var s = "";
  for(var i=0;i<GOAL;i++) s += i < score ? "💖" : "🤍";
  hud.textContent = s;
}
function start(){
  score = 0; hud.textContent = ""; bear.classList.remove("dance");
  screen.innerHTML = '<div class="card"><span class="big">🎂</span><h1>Happy Birthday, ' + NAME + '!</h1><p>I made you a little game. Catch all ' + GOAL + ' treats to unlock a surprise 💌</p><button id="go">Play 💕</button></div>';
  document.getElementById("go").onclick = play;
}
function play(){
  screen.innerHTML = ""; hearts();
  timer = setInterval(spawn, 1500);
  spawn();
}
function spawn(){
  var el = document.createElement("div");
  el.className = "item";
  el.textContent = items[Math.floor(Math.random()*items.length)];
  el.style.left = (Math.random()*(innerWidth-70)) + "px";
  el.style.animationDuration = (7 + Math.random()*3) + "s";
  el.onclick = function(e){ hit(el, e); };
  el.ontouchstart = function(e){ e.preventDefault(); hit(el, e.touches[0]); };
  el.onanimationend = function(){ el.remove(); };
  document.body.appendChild(el);
}
function hit(el, e){
  if(!el.parentNode || score >= GOAL) return;
  var p = document.createElement("div");
  p.className = "pop"; p.textContent = "💗";
  p.style.left = e.clientX + "px"; p.style.top = e.clientY + "px";
  document.body.appendChild(p); setTimeout(function(){ p.remove(); }, 800);
  el.remove(); score++; hearts();
  bear.classList.remove("cheer"); void bear.offsetWidth; bear.classList.add("cheer");
  showMsg(MESSAGES[score-1]);
  if(score >= GOAL){ clearInterval(timer); setTimeout(win, 3500); }
}
function showMsg(t){
  var old = document.getElementById("toast"); if(old) old.remove();
  var m = document.createElement("div");
  m.id = "toast"; m.textContent = t;
  document.body.appendChild(m);
  setTimeout(function(){ if(m.parentNode) m.remove(); }, 3200);
}
function confetti(){
  for(var i=0;i<45;i++){
    var c = document.createElement("div");
    c.className = "conf"; c.textContent = ["🎉","💖","🌸","✨","🎈"][i%5];
    c.style.left = Math.random()*100 + "vw";
    c.style.animationDuration = (2.5 + Math.random()*3) + "s";
    c.style.animationDelay = Math.random() + "s";
    c.onanimationend = function(){ this.remove(); };
    document.body.appendChild(c);
  }
}
function win(){
  document.querySelectorAll(".item").forEach(function(n){ n.remove(); });
  var t = document.getElementById("toast"); if(t) t.remove();
  hud.textContent = "💖💖💖💖💖💖💖💖💖";
  var cd = '<div class="candle"><div class="flame">🔥</div><div class="stick"></div></div>';
  screen.innerHTML = '<div class="card"><div class="title">Happy Birthday,<br><span>' + NAME + '!</span></div><div class="ask">Blow the candles and make your wish 🌬️<br><small>(tap each candle)</small></div><div class="candles">' + cd + cd + cd + '</div><div class="hint" id="hint">&nbsp;</div><p>' + FINAL + '</p><button id="again">Play again 💕</button></div>';
  document.getElementById("again").onclick = start;
  var left = 3, hint = document.getElementById("hint");
  document.querySelectorAll(".candle").forEach(function(c){
    c.onclick = function(){
      if(c.classList.contains("out")) return;
      c.classList.add("out"); left--;
      if(left === 0){ hint.textContent = "Wish made! Happy Birthday 🥳💖"; confetti(); bear.classList.remove("cheer"); bear.classList.add("dance"); }
      else hint.textContent = left + (left === 1 ? " more to go… 🌬️" : " more to go… 🌬️");
    };
  });
  for(var i=0;i<45;i++){
    var c = document.createElement("div");
    c.className = "conf"; c.textContent = ["🎉","💖","🌸","✨","🎈"][i%5];
    c.style.left = Math.random()*100 + "vw";
    c.style.animationDuration = (2.5 + Math.random()*3) + "s";
    c.style.animationDelay = Math.random() + "s";
    c.onanimationend = function(){ this.remove(); };
    document.body.appendChild(c);
  }
}
start();
</script>
